name: IOT IJK ANDROID RELEASE CI

on:
  # 与 snapshot 流水线保持一致：由 tag push 触发，避免 release 事件下 secret 注入差异
  push:
    tags:
      - 'v*'

env:
  IOT_SONATYPE_USERNAME: ${{ secrets.IOT_SONATYPE_USERNAME }}
  IOT_SONATYPE_PASSWORD: ${{ secrets.IOT_SONATYPE_PASSWORD }}
  GPG_DECRYPT_PASSPHRASE: ${{ secrets.GPG_DECRYPT_PASSPHRASE }}
  IOT_GPG_KEYNAME: ${{ secrets.IOT_GPG_KEYNAME }}
  IOT_GPG_PASSPHRASE: ${{ secrets.IOT_GPG_PASSPHRASE }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import GPG signing key
        run: |
          set -euo pipefail
          # 解密 GPG 私钥环并导入，供后续导出为 in-memory 签名 key
          [ -n "${GPG_DECRYPT_PASSPHRASE:-}" ] || { echo "ERROR: GPG_DECRYPT_PASSPHRASE is empty"; exit 1; }
          gpg -d --passphrase "$GPG_DECRYPT_PASSPHRASE" --batch --quiet .github/android/secring.gpg.asc > /tmp/secring.gpg
          [ -s /tmp/secring.gpg ] || { echo "ERROR: decrypted keyring is empty"; exit 1; }
          gpg --batch --import /tmp/secring.gpg
          gpg --list-secret-keys --keyid-format LONG
          echo "==== signing context ===="
          echo "ref=$GITHUB_REF sha=$GITHUB_SHA"
          echo "keyring_sha256=$(shasum -a 256 .github/android/secring.gpg.asc | awk '{print $1}')"
          echo "secret lengths: keyname=${#IOT_GPG_KEYNAME} passphrase=${#IOT_GPG_PASSPHRASE} decrypt=${#GPG_DECRYPT_PASSPHRASE}"
          echo "==== secret key fingerprints ===="
          gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10}'
          if [ -n "${IOT_GPG_KEYNAME:-}" ] && gpg --list-secret-keys "$IOT_GPG_KEYNAME" > /dev/null 2>&1; then
            echo "IOT_GPG_KEYNAME matched: $IOT_GPG_KEYNAME"
          else
            echo "WARN: IOT_GPG_KEYNAME('${IOT_GPG_KEYNAME:-}') not matched, publish step will fall back to the first secret key"
          fi
      - name: Download r25c NDK
        run: |
          # macOS 上 NDK 仅提供 DMG(需公证); r25c 为 universal 二进制, 原生支持 Apple Silicon。
          curl -L -o android-ndk-r25c-darwin.dmg https://dl.google.com/android/repository/android-ndk-r25c-darwin.dmg
          hdiutil attach -nobrowse -mountpoint /Volumes/ndk android-ndk-r25c-darwin.dmg
          mkdir -p "$GITHUB_WORKSPACE/android-ndk-r25c"
          cp -R /Volumes/ndk/AndroidNDK*.app/Contents/NDK/. "$GITHUB_WORKSPACE/android-ndk-r25c/"
          hdiutil detach /Volumes/ndk
          ls -l "$GITHUB_WORKSPACE/android-ndk-r25c"
      - name: Update SDK Version
        env:
          # 通过 env 传递，避免 tag 内容直接拼进 shell
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 以触发本次 release 的 tag 为准，避免误用仓库里其它最新 tag
          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG=$(git describe --tags $(git rev-list --tags --max-count=1))
          fi
          rt=${TAG#*v}
          [ -n "$rt" ] || { echo "ERROR: cannot resolve release version from tag '$TAG'"; exit 1; }
          echo "release tag=$TAG, version=$rt"
          cd android/ijkplayer
          sed -i "" "s#def version.*#def version = \"$rt\"#g" config.gradle
          grep 'def version' config.gradle
      - uses: actions/setup-java@v4
        with:
            distribution: 'temurin' # See 'Supported distributions' for available options
            java-version: '17'
            # 复用 Gradle 依赖缓存，减少 Maven Central 请求（429 限流的主要来源）
            cache: 'gradle'
            cache-dependency-path: |
              android/ijkplayer/**/*.gradle
              android/ijkplayer/gradle/wrapper/gradle-wrapper.properties
      - name: Build with Gradle
        run: |
          set -e
          export ANDROID_NDK="$GITHUB_WORKSPACE/android-ndk-r25c"
          export ANDROID_NDK_ROOT="$ANDROID_NDK"
          ls -l "$ANDROID_NDK"
          
          # build_armv7a.sh 内部已 set -e 并校验 .so，编译失败会在此中断
          sh .github/script/build_armv7a.sh
          cd android/ijkplayer

          # 二次校验：.so 必须存在，缺失则让流水线失败
          ls -l ijkplayer-armv7a/src/main/libs/armeabi-v7a/*.so
          ls -l ijkplayer-arm64/src/main/libs/arm64-v8a/*.so

          ./gradlew :ijkplayer-armv7a:assemble
          ./gradlew :ijkplayer-arm64:assemble
          ./gradlew :ijkplayer-java:assemble
      - name: Publish aar Maven
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.IOT_SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.IOT_SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.IOT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd android/ijkplayer

          # keyring 内含多把私钥，且 IOT_GPG_KEYNAME 可能为空或与 keyring 不一致：
          # 1) secret 指定的 key 若存在，只用它；导出失败直接报错，避免用错身份签名
          # 2) 未指定/未命中时，逐个尝试，选出能被 IOT_GPG_PASSPHRASE 解锁的那把
          PINNED=""
          if [ -n "${IOT_GPG_KEYNAME:-}" ]; then
            PINNED=$(gpg --list-secret-keys --with-colons "$IOT_GPG_KEYNAME" 2>/dev/null | awk -F: '/^fpr/{print $10; exit}' || true)
          fi

          export_signing_key() {
            gpg --batch --pinentry-mode loopback \
                --passphrase "${IOT_GPG_PASSPHRASE:-}" \
                --export-secret-keys --armor "$1"
          }

          # secret 显式指定了 key 却匹配不到，直接失败：避免用错误身份签名
          if [ -n "${IOT_GPG_KEYNAME:-}" ] && [ -z "$PINNED" ]; then
            echo "ERROR: IOT_GPG_KEYNAME='$IOT_GPG_KEYNAME' is not found in the imported keyring."
            gpg --list-secret-keys --keyid-format LONG
            exit 1
          fi

          KEYID=""
          ARMORED=""
          if [ -n "$PINNED" ]; then
            KEYID="$PINNED"
            echo "pinned signing key: $KEYID"
            if ! ARMORED="$(export_signing_key "$KEYID" 2>/tmp/gpg-export.err)" || [ -z "$ARMORED" ]; then
              cat /tmp/gpg-export.err >&2
              echo "ERROR: cannot unlock pinned key $KEYID. IOT_GPG_PASSPHRASE does not match this key."
              echo "       fix the secret, or clear IOT_GPG_KEYNAME to let the job pick an unlockable key."
              exit 1
            fi
          else
            CANDIDATES=$(gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '
              /^sec/{want=1; next}
              want && /^fpr/{print $10; want=0}')
            [ -n "$CANDIDATES" ] || { echo "ERROR: no secret key found in keyring"; gpg --list-secret-keys; exit 1; }
            for fpr in $CANDIDATES; do
              if ARMORED="$(export_signing_key "$fpr" 2>/dev/null)" && [ -n "$ARMORED" ]; then
                KEYID="$fpr"
                echo "using signing key unlocked by passphrase: $KEYID"
                break
              fi
            done
            if [ -z "$ARMORED" ]; then
              echo "ERROR: IOT_GPG_PASSPHRASE cannot unlock any secret key in the keyring."
              gpg --list-secret-keys --keyid-format LONG
              exit 1
            fi
          fi

          # Gradle in-memory signing 使用 long key id
          export ORG_GRADLE_PROJECT_signingInMemoryKeyId="${KEYID: -16}"
          export ORG_GRADLE_PROJECT_signingInMemoryKey="$ARMORED"
          echo "signing key exported, length=${#ORG_GRADLE_PROJECT_signingInMemoryKey}"

          ./gradlew :ijkplayer-armv7a:publishAndReleaseToMavenCentral --stacktrace
          ./gradlew :ijkplayer-arm64:publishAndReleaseToMavenCentral --stacktrace
          ./gradlew :ijkplayer-java:publishAndReleaseToMavenCentral --stacktrace
